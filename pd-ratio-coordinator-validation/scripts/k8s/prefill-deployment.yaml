# Plain vLLM deployment, labeled "prefill" for this experiment.
#
# Deliberately NOT using k8s nvidia.com/gpu resource requests / the GPU
# device plugin — that would force the k8s scheduler to treat each replica
# as needing its own isolated GPU, which a single physical GPU can't
# satisfy once the operator scales past 1. Since this experiment is
# validating the operator's control loop (metrics -> scale decision -> real
# kubectl scale), not real GPU isolation, all replicas share the one
# physical GPU directly via CUDA_VISIBLE_DEVICES=0 and a small
# --gpu-memory-utilization fraction each. Stated here plainly, and again
# in the writeup: this is not testing real per-replica GPU isolation.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prefill
  namespace: pd-validation
  labels:
    app: prefill
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prefill
  template:
    metadata:
      labels:
        app: prefill
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      runtimeClassName: nvidia
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          command: ["vllm", "serve", "Qwen/Qwen3-0.6B"]
          args:
            - "--port=8000"
            - "--gpu-memory-utilization=0.2"
            - "--max-model-len=2048"
            - "--disable-uvicorn-access-log"
          env:
            - name: CUDA_VISIBLE_DEVICES
              value: "0"
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            httpGet:
              path: /v1/models
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: prefill
  namespace: pd-validation
  labels:
    app: prefill
spec:
  selector:
    app: prefill
  ports:
    - port: 8000
      targetPort: 8000
      name: http
