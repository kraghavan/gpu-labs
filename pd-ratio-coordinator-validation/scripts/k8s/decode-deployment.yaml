# Plain vLLM deployment, labeled "decode" for this experiment.
# Same GPU-sharing rationale as prefill-deployment.yaml — see comment there.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: decode
  namespace: pd-validation
  labels:
    app: decode
spec:
  replicas: 1
  selector:
    matchLabels:
      app: decode
  template:
    metadata:
      labels:
        app: decode
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"
    spec:
      runtimeClassName: nvidia
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          command: ["vllm", "serve", "Qwen/Qwen3-0.6B"]
          args:
            - "--port=8001"
            - "--gpu-memory-utilization=0.2"
            - "--max-model-len=2048"
            - "--disable-uvicorn-access-log"
          env:
            - name: CUDA_VISIBLE_DEVICES
              value: "0"
          ports:
            - containerPort: 8001
              name: http
          readinessProbe:
            httpGet:
              path: /v1/models
              port: 8001
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: decode
  namespace: pd-validation
  labels:
    app: decode
spec:
  selector:
    app: decode
  ports:
    - port: 8001
      targetPort: 8001
      name: http
